[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "network-operations-builder"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "PyYAML>=6,<7", "Jinja2>=3.1,<4", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
nob = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
