profile_id: hub-gate
version: 1.3.0
defaults:
  speed: 100g
  mtu: 4484
  fec: none
  isis_level: 2
  isis_metric: 1000
  isis_hello_interval: 10
  isis_hold_time: 30
  cos_mode: backbone
locked: {}
constraints: {}
rules:
  isis_passive_overrides: {isis_metric: 0, mpls_enabled: false, ldp_enabled: false}
  # User-confirmed policy; Rx Optics +7000 intentionally deferred.
  rmon_alarm_bases: {qdrop_alarm_id: 8000, crc_alarm_id: 9000}
  backbone_rewrites:
    - [dscp-ipv6, OUT_ANY_IPv6_REMARK, mpls]
    - [dscp-ipv6, OUT_ANY_IPv6_REMARK_temp, '']
    - [exp, OUT_ANY_EXP_REMARK, '']
    - [inet-precedence, OUT_ANY_IPv4_REMARK, '']
  external_classifiers:
    - [dscp-ipv6, IN_ISP_IPv6]
    - [inet-precedence, IN_ISP_IPv4]
